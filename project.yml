# Source of truth for Squatter.xcodeproj — regenerate with `xcodegen generate`.
name: Squatter
options:
  bundleIdPrefix: sa.ni
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: M8A3G95883
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Squatter:
    type: application
    platform: macOS
    sources:
      - path: Squatter
        excludes:
          - "Info.plist"
    info:
      path: Squatter/Info.plist
      properties:
        CFBundleName: Squatter
        CFBundleDisplayName: Squatter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 National Idea LLC. MIT License."
    entitlements:
      path: Squatter/Squatter.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.ni.squatter
        PRODUCT_NAME: Squatter
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  SquatterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SquatterTests
    dependencies:
      - target: Squatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.ni.squatter.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Squatter.app/Contents/MacOS/Squatter
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Squatter:
    build:
      targets:
        Squatter: all
        SquatterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SquatterTests
    archive:
      config: Release
